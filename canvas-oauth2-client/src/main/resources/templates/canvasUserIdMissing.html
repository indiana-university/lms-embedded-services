<html lang="en-US"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{oauth2Layout}">
<head>
    <title>Unable to Connect Canvas Account</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="rvt-ts-26 rvt-text-bold rvt-m-bottom-md" th:text="${heading}">Unable to connect your Canvas account</h1>
    <p class="rvt-m-bottom-md" th:text="${instructions}">
        This tool's Canvas integration isn't fully configured for this course yet, so it can't
        identify your Canvas account. Please contact your Canvas administrator and let them know
        this tool's LTI configuration is missing the custom_canvas_user_id parameter.
    </p>
</div>
</body>
</html>
